<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>將進酒 - 李白</title>
    <style>
        /* *1 整頁背景設為粉紅色 */
        body {
            background-color: pink;
            text-align: center;
            font-family: "標楷體", DFKai-sb, serif;
        }
        /* *2 詩的標題設為: 藍色、40點字 */
        h1 {
            color: blue;
            font-size: 40pt;
        }
        /* *2 詩的內容設為: 綠色、30點字 */
        p {
            color: green;
            font-size: 30pt;
            line-height: 1.6;
        }
        /* *3 頁面中央放1楨李白的畫像圖(長或寬為300px)，深紫色圖框線(5px)、四周做成圓角(半徑50px) */
        img {
            width: 300px;
            border: 5px solid darkviolet; /* 深紫色圖框線 */
            border-radius: 50px;          /* 圓角半徑50px */
            display: block;
            margin: 20px auto;            /* 圖片置中 */
        }
    </style>
</head>
<body>

    <h1>將進酒 — 李白</h1>

    <img src="libai.jpg" alt="李白畫像">

    <p>
        君不見黃河之水天上來，奔流到海不復回。<br>
        君不見高堂明鏡悲白髮，朝如青絲暮成雪。<br>
        人生得意須盡歡，莫使金樽空對月。<br>
        天生我材必有用，千金散盡還復來。<br>
        烹羊宰牛且為樂，會須一飲三百杯。<br>
        岑夫子，丹丘生，將進酒，杯莫停。<br>
        與君歌一曲，請君為我傾耳聽。<br>
        鐘鼓饌玉不足貴，但願長醉不復醒。<br>
        古來聖賢皆寂寞，惟有飲者留其名。<br>
        陳王昔時宴平樂，斗酒十千恣歡謔。<br>
        主人何為言少錢，徑須沽取對君酌。<br>
        五花馬，千金裘，呼兒將出換美酒，與爾同銷萬古愁。
    </p>

</body>
</html>
